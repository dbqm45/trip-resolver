[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-resolver"
version = "0.2.0"
description = "Odtwarza faktycznie przebytą trasę (chronologicznie) na podstawie metadanych zdjęć."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
trip-resolver = "trip_resolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
